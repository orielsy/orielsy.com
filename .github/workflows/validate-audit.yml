name: Validate Audit Branch

on:
  push:
    branches:
      - audit/final-site-cleanup

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run Adaptive UI tests
        run: npm run test:adaptive-ui

      - name: Report unreferenced Astro components
        shell: bash
        run: |
          echo 'UNREFERENCED_ASTRO_COMPONENTS_BEGIN'
          while IFS= read -r file; do
            name="$(basename "$file")"
            refs="$(git grep -l -F "$name" -- src ":!$file" 2>/dev/null || true)"
            if [[ -z "$refs" ]]; then
              echo "$file"
            fi
          done < <(find src/components -type f -name '*.astro' | sort)
          echo 'UNREFERENCED_ASTRO_COMPONENTS_END'

      - name: Report unreferenced speechBubbles assets
        shell: bash
        run: |
          echo 'UNREFERENCED_SPEECHBUBBLES_ASSETS_BEGIN'
          while IFS= read -r file; do
            rel="/${file#public/}"
            refs="$(git grep -l -F "$rel" -- src 2>/dev/null || true)"
            if [[ -z "$refs" ]]; then
              echo "$file"
            fi
          done < <(find public/projects/speechbubbles -maxdepth 1 -type f | sort)
          echo 'UNREFERENCED_SPEECHBUBBLES_ASSETS_END'

      - name: Report publication radius overrides
        shell: bash
        run: |
          echo 'PUBLICATION_RADIUS_OVERRIDES_BEGIN'
          git grep -n -F 'border-radius: 0 !important' -- src/components/research || true
          echo 'PUBLICATION_RADIUS_OVERRIDES_END'

      - name: Build site
        run: npm run build
