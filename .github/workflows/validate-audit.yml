name: Validate Audit Branch

on:
  push:
    branches:
      - audit/final-site-cleanup

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run Adaptive UI tests
        run: npm run test:adaptive-ui

      - name: Build site
        run: npm run build
