name: Branch Visual Preview

on:
  push:
    branches-ignore:
      - main
      - gh-pages
      - production-deploy-trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-visual-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build and capture branch preview
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      PREVIEW_ORIGIN: http://127.0.0.1:4321

    steps:
      - name: Check out requested branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build branch
        run: npm run build

      - name: Install Playwright and Chromium for visual capture
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start built site
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/orielsy-preview.log 2>&1 &
          echo $! > /tmp/orielsy-preview.pid
          for attempt in {1..30}; do
            if curl --fail --silent "$PREVIEW_ORIGIN/" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/orielsy-preview.log
          exit 1

      - name: Capture configured routes
        run: node .preview/capture.mjs

      - name: Include built HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p branch-preview/html
          while IFS= read -r html_file; do
            relative="${html_file#dist/}"
            mkdir -p "branch-preview/html/$(dirname "$relative")"
            cp "$html_file" "branch-preview/html/$relative"
          done < <(find dist -type f -name '*.html' | sort)

      - name: Write preview manifest
        run: |
          cat > branch-preview/manifest.txt <<EOF
          repository=${GITHUB_REPOSITORY}
          branch=${GITHUB_REF_NAME}
          commit=${GITHUB_SHA}
          run_id=${GITHUB_RUN_ID}
          routes_file=.preview/routes.txt
          production_deployed=false
          EOF
          cp .preview/routes.txt branch-preview/routes.txt
          cp /tmp/orielsy-preview.log branch-preview/server.log

      - name: Include built site
        run: cp -R dist branch-preview/dist

      - name: Upload branch visual preview
        uses: actions/upload-artifact@v4
        with:
          name: branch-visual-preview-${{ github.ref_name }}
          path: branch-preview/
          if-no-files-found: error
          retention-days: 7
