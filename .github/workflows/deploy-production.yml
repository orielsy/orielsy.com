name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches:
      - production-deploy-trigger
    paths:
      - ".deploy/trigger"

permissions:
  contents: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish orielsy.com
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Configure deployment Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to gh-pages
        run: |
          node scripts/assert-main-branch.mjs
          npm run build
          npx gh-pages -d dist -b gh-pages --dotfiles --nojekyll -u "github-actions-bot <support+actions@github.com>"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
